
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ♡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #000;
      color: white;
      font-family: Georgia, serif;
    }

    #escena {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(ellipse at center, #190711 0%, #080308 48%, #000 80%);
      overflow: hidden;
    }

    h1 {
      margin: 0 0 10px;
      color: #ff9cbe;
      font-size: clamp(22px, 4vw, 38px);
      text-align: center;
      font-weight: normal;
    }

    .subtitulo {
      color: #d6a5b8;
      font-size: 14px;
      text-align: center;
    }

    #corazon {
      position: relative;
      width: min(85vw, 540px);
      height: min(65vw, 400px);
      min-height: 260px;
      margin: 10px auto;
    }

    .letra {
      position: absolute;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      color: #ff78a8;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      text-shadow: 0 0 5px #ff4c91, 0 0 12px #ff287b;
      user-select: none;
    }

    #foto-marco {
      position: absolute;
      top: 49%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(100px, 23vw, 175px);
      height: clamp(100px, 23vw, 175px);
      border: 2px solid #ff78a8;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 22px #ff287b;
      background: #190711;
    }

    #foto {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #mensaje-final {
      color: #ffc4d8;
      text-align: center;
      font-size: clamp(16px, 3vw, 23px);
      line-height: 1.6;
      opacity: 0;
      transition: opacity 2s ease;
      max-width: 550px;
    }

    #mensaje-final.visible {
      opacity: 1;
    }

    #oscuridad {
      position: fixed;
      inset: 0;
      z-index: 10;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: manipulation;
      transition: opacity 3s ease;
    }

    #oscuridad.revelar {
      opacity: 0;
      pointer-events: none;
    }

    #indicacion {
      position: fixed;
      z-index: 11;
      left: 50%;
      bottom: 12%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #ff78a8;
      animation: latido 2s infinite;
      pointer-events: none;
      opacity: 1;
      visibility: visible;
      transition: opacity 1s ease, visibility 1s ease;
    }

    #indicacion.oculta {
      opacity: 0;
      visibility: hidden;
    }

    @keyframes latido {
      0%, 100% {
        opacity: 0.6;
      }
      50% {
        opacity: 1;
      }
    }

    @media (max-height: 550px) {
      #corazon {
        height: 55vh;
        min-height: 210px;
      }

      #indicacion {
        bottom: 4%;
      }
    }
  </style>
</head>

<body>
  <main id="escena">
    <h1>Happy Birthday, my love ♡</h1>
    <p class="subtitulo">You make my world brighter.</p>

    <div id="corazon"></div>

    <div id="foto-marco">
      <img id="foto" src="mibb.jpg" alt="Nosotros">
    </div>

    <div id="mensaje-final">
      Happy birthday, my love. ♡<br>
      No matter how dark the world gets,<br>
      you will always be my light.<br>
      <span style="color:#ff78a8">I love u forever &lt;3</span>
    </div>
  </main>

  <canvas id="oscuridad"></canvas>

  <div id="indicacion">
    CLICK TO DISCOVER SOMETHING ♡
  </div>

  <script>
    const canvas = document.getElementById("oscuridad");
    const ctx = canvas.getContext("2d");
    const indicacion = document.getElementById("indicacion");
    const mensaje = document.getElementById("mensaje-final");
    const corazon = document.getElementById("corazon");

    let clicks = 0;
    let terminado = false;

    const CLICKS_NECESARIOS = 22;

    function prepararOscuridad() {
      const escala = window.devicePixelRatio || 1;

      canvas.width = window.innerWidth * escala;
      canvas.height = window.innerHeight * escala;

      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";

      ctx.setTransform(escala, 0, 0, escala, 0, 0);
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    }

    prepararOscuridad();

    const cantidadLetras = 150;

    for (let i = 0; i < cantidadLetras; i++) {
      const t = (i / cantidadLetras) * Math.PI * 2;

      const x = 16 * Math.pow(Math.sin(t), 3);
      const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

      const palabra = document.createElement("span");
      palabra.className = "letra";
      palabra.textContent = "i love u <3";

      palabra.style.left = (50 + (x / 18) * 46) + "%";
      palabra.style.top = (48 - (y / 17) * 45) + "%";

      corazon.appendChild(palabra);
    }

    canvas.addEventListener("pointerdown", function(event) {
      if (terminado) return;

      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      const radio = Math.max(
        95,
        Math.min(145, window.innerWidth * 0.16)
      );

      const luz = ctx.createRadialGradient(x, y, 5, x, y, radio);

      luz.addColorStop(0, "rgba(0,0,0,1)");
      luz.addColorStop(0.55, "rgba(0,0,0,0.85)");
      luz.addColorStop(1, "rgba(0,0,0,0)");

      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = luz;
      ctx.beginPath();
      ctx.arc(x, y, radio, 0, Math.PI * 2);
      ctx.fill();

      clicks++;

      if (clicks >= 1) {
        indicacion.classList.add("oculta");
      }

      if (clicks >= CLICKS_NECESARIOS) {
        terminarRevelado();
      }
    });

    function terminarRevelado() {
      if (terminado) return;
      terminado = true;

      indicacion.classList.add("oculta");
      canvas.classList.add("revelar");
      mensaje.classList.add("visible");

      setTimeout(() => {
        canvas.style.display = "none";
      }, 3200);
    }

    window.addEventListener("resize", prepararOscuridad);
  </script>
</body>
</html>
